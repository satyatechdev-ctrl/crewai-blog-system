name: "CrewAI Blog System"

# CrewAI Cloud pipeline configuration
# Triggers on push to main branch when files in this repo change

# This configuration tells CrewAI Cloud how to build, test, and deploy the crew.
# Once you push to GitHub, CrewAI Cloud watches for changes and re-deploys.

on:
  push:
    branches:
      - main
      - crewai-cloud
    paths:
      - "src/crewai_blog_system/**"
      - ".crewai/**"
      - ".github/workflows/**"
      - "pyproject.toml"
      - "uv.lock"
      - "tests/**"
      - "README.md"
  pull_request:
    branches:
      - main
    paths:
      - "src/crewai_blog_system/**"
      - ".crewai/**"
      - ".github/workflows/**"
      - "pyproject.toml"
      - "uv.lock"
      - "tests/**"
      - "README.md"

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6

      - name: Install locked dependencies
        run: uv sync --locked --extra dev

      - name: Run tests
        run: uv run --locked pytest tests/ -v --cov=crewai_blog_system
        
      - name: Lint
        run: uv run --locked ruff check src/crewai_blog_system/ tests/

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6

      - name: Install locked dependencies
        run: uv sync --locked --extra dev

      - name: Clean stale build artifacts
        run: find src/ -type d -name '*.egg-info' -prune -exec rm -rf {} +

      - name: Run CrewAI pre-deploy validation
        env:
          EURON_API_KEY: validation-only
          OPENAI_API_KEY: validation-only
        run: uv run --locked crewai deploy validate

      - name: Login to CrewAI Cloud
        run: echo "1" | uv run --locked crewai login

      - name: Verify deployment structure
        env:
          EURON_API_KEY: validation-only
        run: |
          echo "Checking config/ directory..."
          ls -la src/crewai_blog_system/config/
          echo "Checking crew.py for @CrewBase..."
          grep -n '@CrewBase' src/crewai_blog_system/crew.py || { echo "ERROR: @CrewBase not found"; exit 1; }
          uv run --locked python -c "from crewai_blog_system.crew import build_crew; build_crew()"

      - name: Create deployment
        env:
          EURON_API_KEY: validation-only
          OPENAI_API_KEY: validation-only
        run: uv run --locked crewai deploy create --yes

      - name: Deploy to CrewAI Cloud
        env:
          EURON_API_KEY: validation-only
          OPENAI_API_KEY: validation-only
        run: uv run --locked crewai deploy push
