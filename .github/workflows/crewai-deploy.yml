name: "CrewAI Blog System"

# CrewAI Cloud pipeline configuration
# Triggers on push to main branch when files in this repo change

# This configuration tells CrewAI Cloud how to build, test, and deploy the crew.
# Once you push to GitHub, CrewAI Cloud watches for changes and re-deploys.

on:
  push:
    branches:
      - main
      - crewai-cloud
    paths:
      - "src/crewai_blog_system/**"
      - ".crewai/**"
      - ".github/workflows/**"
      - "pyproject.toml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          
      - name: Install dependencies
        run: pip install -e ".[dev]"
        
      - name: Run tests
        run: pytest tests/ -v --cov=src/crewai_blog_system
        
      - name: Lint
        run: ruff check src/crewai_blog_system/ tests/

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]" crewai-cli

      - name: Login to CrewAI Cloud
        run: echo "1" | crewai login

      - name: Create .env file
        run: |
          echo "OPENAI_API_KEY=${{ secrets.EURON_API_KEY }}" > .env
          echo "OPENAI_BASE_URL=https://api.euron.one/api/v1/euri" >> .env

      - name: Create deployment
        run: printf '\n\n' | crewai deploy create --skip-validate

      - name: Deploy to CrewAI Cloud
        run: crewai deploy push
