[project]
name = "crewai-blog-system"
version = "1.0.0"
description = "Production-ready CrewAI multi-agent system for automated technical blog post generation"
requires-python = ">=3.10,<3.14"
license = {text = "MIT"}
authors = [
    {name = "Euron Student"}
]
dependencies = [
    "crewai>=0.95.0",
    "langchain-openai>=0.3.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.8.0",
]

[project.scripts]
crewai-blog-system = "crewai_blog_system.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "S", "W"]
ignore = ["S101", "S311"]  # Allow asserts in tests; allow hash usage (not for passwords)

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/crewai_blog_system"]
include = ["src/crewai_blog_system/config/*.yaml"]
