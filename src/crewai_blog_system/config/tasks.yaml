# Task definitions for the CrewAI Blog System

research_task:
  agent: researcher
  description: >-
    Research the topic "{topic}" thoroughly.
    Draft a research brief from model knowledge, covering:
    - What the topic is and why it matters
    - Key technical concepts and how they work
    - Real-world applications and use cases
    - Established trends and possible future directions
    Do not invent citations, statistics, expert opinions, or claims of live research.
    Clearly label time-sensitive or uncertain information that needs independent verification.
  expected_output: >-
    A structured research document covering the topic with clear headings.
    Mark uncertain or time-sensitive claims for verification and do not include
    fabricated references.

write_task:
  agent: writer
  description: >-
    Using the research notes provided by the Researcher, write a
    well-structured technical blog post about "{topic}".
    Structure the post with:
    - A compelling title and introduction
    - Clear H2/H3 sections
    - Code examples where relevant (in fenced code blocks)
    - Practical takeaways and real-world context
    - A conclusion with actionable insights
    Make it engaging, informative, and readable for a technical audience.
  expected_output: >-
    A complete blog post in Markdown format (2,000-3,000 words) with proper
    structure, headings, code examples, and a clear narrative flow.
    Ready for editorial review.

edit_task:
  agent: editor
  description: >-
    Review the draft blog post about "{topic}" for:
    - Claims that appear unsupported or need independent verification
    - Technical correctness
    - Writing quality (grammar, clarity, flow)
    - Structure and formatting
    - Consistent tone and style
    - Proper use of headings and formatting
    - Engaging opening and strong conclusion
    Improve any areas that need refinement and return the final polished version.
  expected_output: >-
    A polished, publication-ready blog post in Markdown format.
    Do not state that claims were independently verified. Flag any remaining
    concerns that readers should verify.
